name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / Zig ${{ matrix.zig }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [x86_64, aarch64]
        zig: ["0.17.0"]
        include:
          - os: ubuntu-latest
            arch: x86
            zig: "0.17.0"
          - os: windows-latest
            arch: x86
            zig: "0.17.0"
        exclude:
          - os: macos-latest
            arch: x86
          - os: macos-latest
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig ${{ matrix.zig }} (${{ matrix.arch }})
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Install QEMU for cross tests (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static qemu-user
      - name: Install QEMU for cross tests (Windows)
        if: matrix.os == 'windows-latest' && matrix.arch == 'aarch64'
        run: choco install qemu -y
      - name: Build
        run: zig build -Dtarget=${{ matrix.arch }}-${{ fromJSON('{"ubuntu-latest":"linux","windows-latest":"windows","macos-latest":"macos"}')[matrix.os] }}
      - name: Check (compile library, tests, and all examples)
        run: zig build check -Dtarget=${{ matrix.arch }}-${{ fromJSON('{"ubuntu-latest":"linux","windows-latest":"windows","macos-latest":"macos"}')[matrix.os] }}
      - name: Test
        shell: bash
        run: |
          TARGET="${{ matrix.arch }}-${{ fromJSON('{"ubuntu-latest":"linux","windows-latest":"windows","macos-latest":"macos"}')[matrix.os] }}"
          if [ "${{ matrix.arch }}" = "aarch64" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            zig build test -Dtarget=$TARGET --summary all -fqemu
          elif [ "${{ matrix.arch }}" = "aarch64" ] && [ "${{ matrix.os }}" = "windows-latest" ]; then
            zig build -Dtarget=$TARGET
            echo "Cross build verified for $TARGET"
          else
            zig build test -Dtarget=$TARGET --summary all
          fi
      - name: Fuzz
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64'
        run: zig build fuzz --summary all
      - name: Run all examples
        shell: bash
        run: |
          TARGET="${{ matrix.arch }}-${{ fromJSON('{"ubuntu-latest":"linux","windows-latest":"windows","macos-latest":"macos"}')[matrix.os] }}"
          if [ "${{ matrix.arch }}" = "x86_64" ] || [ "${{ matrix.arch }}" = "x86" ]; then
            zig build run-all-examples -Dtarget=$TARGET
          else
            echo "Skipping example execution on $TARGET (no emulation)"
          fi

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check src examples build.zig build.zig.zon

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: ./docs
        run: bun install
      - name: Build with VitePress
        working-directory: ./docs
        run: bun run docs:build
